<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants entdecken</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Restaurants entdecken</h1>

        <label class="filter">
            <input type="checkbox" id="vegi-filter">
            Nur Restaurants mit vegetarischen Gerichten
        </label>

        <label for="ort-filter">Ort</label>
        <select id="ort-filter">
            <option value="">Alle Orte</option>
            <option value="Luzern">Luzern</option>
            <option value="Rotkreuz">Rotkreuz</option>
        </select>

        <section class="restaurant-liste" aria-label="Restaurantenliste">
            <article class="restaurant" data-id="1" data-vegi="ja" data-ort="Luzern">
                <img class="restaurant-bild" src="bilder/bistro-am-see.png" alt="Gedeckte Tische auf einer Terrasse am see">
                <h2>Bistro am See</h2>
                <p> Luzern · Mediterrane Küche</p>
                <p>Vegetarische Gerichte verfügbar</p>
                <button type="button" class="anfrage-button">Tisch anfragen</button>
            </article>

            <article class="restaurant" data-id="2" data-vegi="nein" data-ort="Rotkreuz">
                <img class="restaurant-bild" src="bilder/grillstube.png" alt="Gastraum mit Holztischen und offenen Grill">
                <h2>Grillstube</h2>
                <p>Rotkreuz · Grillspezialität</p>
                <button type="button" class="anfrage-button">Tisch anfragen</button>
            </article>
        </section>
        <section id="anfrage-bereich" hidden>
            <h2 id="anfrage-titel"></h2>
            <p>Du kannst deinen Tisch ohne Konto anfragen.</p>
            <form id="anfrage-formular">
                <input type="hidden" id="restaurant-id" name="restaurantId">
                <p>
                    <label>
                        Datum
                        <input type="date" name="datum" required>
                    </label>
                </p>

                <p>
                    <label>
                        Gewünschte Uhrzeit
                        <input type="time" name="uhrzeit" required>
                    </label>
                </p>

                <p>
                    <label>
                        Anzahl Gäste
                        <input type="number" name="anzahlGaeste" min="1" value="2" required>
                    </label>
                </p>

                <p>
                    <label>
                        Dein Name
                        <input type="text" name="gastname" autocomplete="name" required>
                    </label>
                </p>

                <p>
                    <label>
                        Deine E-Mail-Adresse
                        <input type="email" name="email" autocomplete="email" required>
                    </label>
                </p>

                <button type="submit">Eingabe prüfen</button>
            </form>
        </section>
    </main>
    
</body>
</html>
